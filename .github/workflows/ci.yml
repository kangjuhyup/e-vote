name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint without modifying files
        run: pnpm --filter @vote/server exec eslint 'src/**/*.ts' 'test/**/*.ts'
      - name: Unit tests
        run: pnpm --filter @vote/server run test --runInBand
      - name: Build
        run: pnpm --filter @vote/server build

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @vote/ui lint
      - name: Unit tests
        run: pnpm --filter @vote/ui test
      - name: Build
        run: pnpm --filter @vote/ui build
