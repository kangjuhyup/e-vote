name: Publish Vote images

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: vote-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      repository_lc: ${{ steps.version.outputs.repository_lc }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Confirm the merged release version
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          version=$(node -p "require('./server/package.json').version")
          ui_version=$(node -p "require('./ui/package.json').version")
          previous=$(git show "$BASE_SHA:server/package.json" | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => console.log(JSON.parse(s).version))')
          test "$version" = "$ui_version"
          test "$version" != "$previous"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "repository_lc=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Server lint
        run: pnpm --filter @vote/server exec eslint 'src/**/*.ts' 'test/**/*.ts'
      - name: Server tests
        run: pnpm --filter @vote/server run test --runInBand
      - name: UI lint
        run: pnpm --filter @vote/ui lint
      - name: UI tests
        run: pnpm --filter @vote/ui test
      - name: Build server
        run: pnpm --filter @vote/server build
      - name: Build UI
        run: pnpm --filter @vote/ui build

  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: Dockerfile.server
          - name: ui
            dockerfile: Dockerfile.ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/arm64
          build-args: |
            VCS_REF=${{ github.event.pull_request.merge_commit_sha }}
            NEXT_PUBLIC_VOTE_API_MODE=live
            NEXT_PUBLIC_VOTE_API_BASE_URL=/api/vote-server
            NEXT_PUBLIC_PARTICIPATION_API_BASE_URL=https://vote-api.rvkang.app
          tags: |
            ghcr.io/${{ needs.verify.outputs.repository_lc }}/${{ matrix.name }}:v${{ needs.verify.outputs.version }}
            ghcr.io/${{ needs.verify.outputs.repository_lc }}/${{ matrix.name }}:sha-${{ github.event.pull_request.merge_commit_sha }}
          cache-from: type=gha,scope=vote-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=vote-${{ matrix.name }},ignore-error=true
