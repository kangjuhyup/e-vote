name: vote

x-auth-service-image: &auth-service-image ${AUTH_SERVICE_IMAGE:-ghcr.io/kangjuhyup/auth/auth-service@sha256:5886e25fd78b6c5b6249311ca589a23f6215877af896b80fed7039c63c359668}
x-auth-ui-image: &auth-ui-image ${AUTH_UI_IMAGE:-ghcr.io/kangjuhyup/auth/auth-ui@sha256:64a7ee74ebf3a632d59a95dde5fbb6bb28daab72ff14e53358407de2197f8f98}
x-auth-service-environment: &auth-service-environment
  DB_DRIVER: ${AUTH_SERVICE_DB_DRIVER:-postgresql}
  DB_HOST: ${AUTH_SERVICE_DB_HOST:-auth-postgres}
  DB_PORT: ${AUTH_SERVICE_DB_PORT:-5432}
  DB_NAME: ${AUTH_SERVICE_DB_NAME:-auth}
  DB_USER: ${AUTH_SERVICE_DB_USER:-auth}
  DB_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD:-auth-local-password}
  REDIS_URL: ${AUTH_SERVICE_REDIS_URL:-redis://redis:6379/0}
  OIDC_ISSUER: ${AUTH_SERVICE_OIDC_ISSUER:-http://localhost:3002}
  OIDC_COOKIE_KEYS: ${AUTH_SERVICE_OIDC_COOKIE_KEYS:-vote-local-oidc-cookie-key-1,vote-local-oidc-cookie-key-2}
  OIDC_ACCESS_TOKEN_FORMAT: ${AUTH_SERVICE_OIDC_ACCESS_TOKEN_FORMAT:-opaque}
  OIDC_ADAPTER_DRIVER: ${AUTH_SERVICE_OIDC_ADAPTER_DRIVER:-redis}
  OIDC_CACHE_TTL_MARGIN_SEC: ${AUTH_SERVICE_OIDC_CACHE_TTL_MARGIN_SEC:-30}
  OIDC_CACHE_NEGATIVE_TTL_SEC: ${AUTH_SERVICE_OIDC_CACHE_NEGATIVE_TTL_SEC:-30}
  OIDC_CACHE_BACKFILL_TTL_SEC: ${AUTH_SERVICE_OIDC_CACHE_BACKFILL_TTL_SEC:-300}
  OTP_TOKEN_SECRET: ${AUTH_SERVICE_OTP_TOKEN_SECRET:-vote-local-otp-token-secret}
  OTP_PASSWORD_RESET_TTL_SEC: ${AUTH_SERVICE_OTP_PASSWORD_RESET_TTL_SEC:-900}
  JWKS_ENCRYPTION_KEY: ${AUTH_SERVICE_JWKS_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-vote-local-admin-password-change-me}
  ADMIN_UI_URL: ${AUTH_ADMIN_UI_URL:-http://localhost:3003}
  ADMIN_SESSION_COOKIE_SECURE: ${AUTH_ADMIN_COOKIE_SECURE:-false}
  ADMIN_SESSION_COOKIE_SAME_SITE: ${AUTH_ADMIN_COOKIE_SAME_SITE:-lax}
  HTTP_CORS_ORIGINS: ${AUTH_HTTP_CORS_ORIGINS:-http://localhost:3003}
  HTTP_TRUST_PROXY_HOPS: ${AUTH_HTTP_TRUST_PROXY_HOPS:-1}
  HTTP_HSTS_ENABLED: ${AUTH_HTTP_HSTS_ENABLED:-false}
  SEED_AUTH_PUBLIC_BASE: ${AUTH_SERVICE_PUBLIC_BASE:-http://localhost:3002}

services:
  postgres:
    image: postgres:16-alpine
    container_name: vote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vote}
      POSTGRES_USER: ${POSTGRES_USER:-vote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vote}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vote-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6381}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  auth-postgres:
    image: postgres:16-alpine
    container_name: vote-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_SERVICE_DB_NAME:-auth}
      POSTGRES_USER: ${AUTH_SERVICE_DB_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD:-auth-local-password}
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  auth-bootstrap:
    image: *auth-service-image
    container_name: vote-auth-bootstrap
    restart: 'no'
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *auth-service-environment
    command:
      [
        'sh',
        '-c',
        'node dist/cli/bootstrap-admin.js && node dist/cli/bootstrap-acme.js',
      ]

  auth-service:
    image: *auth-service-image
    container_name: vote-auth-service
    restart: unless-stopped
    depends_on:
      auth-bootstrap:
        condition: service_completed_successfully
    environment: *auth-service-environment
    ports:
      - '127.0.0.1:${AUTH_SERVICE_PORT:-3002}:3000'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 5

  auth-client-bootstrap:
    image: *auth-service-image
    container_name: vote-auth-client-bootstrap
    restart: 'no'
    entrypoint: ['node', '/app/bootstrap-auth-client.mjs']
    depends_on:
      auth-service:
        condition: service_healthy
    environment:
      AUTH_BASE_URL: http://auth-service:3000
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-vote-local-admin-password-change-me}
      AUTH_CLIENT_ID: e-vote
      AUTH_CLIENT_REDIRECT_URI: ${AUTH_CLIENT_REDIRECT_URI:-http://localhost:3001/api/auth/callback/e-vote}
      AUTH_CLIENT_POST_LOGOUT_URI: ${AUTH_CLIENT_POST_LOGOUT_URI:-http://localhost:3001}
      AUTH_CLIENT_ALLOWED_RESOURCE: ${VOTE_AUTH_AUDIENCE:-https://vote-api.example.com}
      AUTH_RESOURCE_SERVER_CLIENT_ID: ${VOTE_AUTH_INTROSPECTION_CLIENT_ID:-vote-api}
      AUTH_RESOURCE_SERVER_CLIENT_SECRET: ${VOTE_AUTH_INTROSPECTION_CLIENT_SECRET:-vote-local-introspection-secret-change-me}
    volumes:
      - ./scripts/bootstrap-auth-client.mjs:/app/bootstrap-auth-client.mjs:ro

  auth-ui:
    image: *auth-ui-image
    container_name: vote-auth-ui
    restart: unless-stopped
    depends_on:
      auth-client-bootstrap:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${AUTH_UI_PORT:-3003}:80'
    volumes:
      - ./docker/auth-ui.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1/healthz >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  auth-postgres-data:
  redis-data:
